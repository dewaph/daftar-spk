<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daftar SPK</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f6f7f9;--card:#fff;--text:#1b2230;--muted:#6b7485;--line:#e3e6ec;--accent:#1f6feb;--accent-soft:#e8f0fe;--chip:#eef1f5}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#12151b;--card:#1b2029;--text:#e8ebf1;--muted:#98a1b3;--line:#2a313d;--accent:#6aa3ff;--accent-soft:#1f2d47;--chip:#252c38}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#12151b;--card:#1b2029;--text:#e8ebf1;--muted:#98a1b3;--line:#2a313d;--accent:#6aa3ff;--accent-soft:#1f2d47;--chip:#252c38}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:960px;margin:0 auto;padding:20px 16px 40px}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:16px}
h1{font-size:22px;margin:0 0 2px}
.sub{color:var(--muted);font-size:13px}
button{font:inherit;color:inherit;cursor:pointer}
.icon{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 12px}
.tools{display:grid;grid-template-columns:1fr;gap:10px;margin-bottom:12px}
@media(min-width:640px){.tools{grid-template-columns:repeat(4,1fr)}#q{grid-column:1/-1}}
input,select{width:100%;font:inherit;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
input:focus,select:focus{outline:2px solid var(--accent);outline-offset:-1px}
.count{color:var(--muted);font-size:13px;margin:4px 2px 10px}
.tablewrap{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:12px}
table{width:100%;border-collapse:collapse;min-width:700px}
th,td{text-align:left;padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);background:var(--card);cursor:pointer;user-select:none;white-space:nowrap;position:sticky;top:0}
th.on{color:var(--accent)}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--accent-soft)}
td.tgl{white-space:nowrap;color:var(--muted)}
td.no{white-space:nowrap}
.chip{display:inline-block;background:var(--chip);border-radius:6px;padding:2px 8px;font-variant-numeric:tabular-nums;font-size:13px}
mark{background:#ffd54a66;color:inherit;border-radius:3px}
.empty{padding:32px;text-align:center;color:var(--muted)}
.pager{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:12px}
.pager button{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 14px}
.pager button:disabled{opacity:.4;cursor:default}
.tabs{display:flex;gap:4px;padding:4px;background:var(--chip);border-radius:12px;margin-bottom:14px}
.tab{flex:1;border:0;background:transparent;border-radius:9px;padding:10px 14px;font-weight:600;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:8px}
.tab.on{background:var(--card);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.tab .n{font-size:12px;font-weight:600;background:var(--accent-soft);color:var(--accent);border-radius:99px;padding:1px 8px}
td.pw{white-space:nowrap}
.pb{display:inline-block;padding:2px 11px;border-radius:99px;font-size:13px;font-weight:600;line-height:1.5;background:hsl(var(--h) 80% 91%);color:hsl(var(--h) 65% 24%);border:1px solid hsl(var(--h) 60% 78%)}
.pb+.pb{margin-left:4px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .pb{background:hsl(var(--h) 38% 22%);color:hsl(var(--h) 85% 83%);border-color:hsl(var(--h) 38% 34%)}}
:root[data-theme="dark"] .pb{background:hsl(var(--h) 38% 22%);color:hsl(var(--h) 85% 83%);border-color:hsl(var(--h) 38% 34%)}
td.pw.na{color:var(--muted)}
.mobsort{display:none}
@media(max-width:639px){
.wrap{padding:14px 12px 32px}
h1{font-size:20px}
input,select{font-size:16px;padding:12px 14px;border-radius:12px}
.mobsort{display:block}
#pp{display:none}
.tools{gap:8px;grid-template-columns:1fr 1fr}
#q{grid-column:1/-1}
#sb{grid-column:1/-1}
.count{font-size:13px;margin:2px 2px 12px}
.tablewrap{background:none;border:0;overflow:visible;border-radius:0}
table{min-width:0}
table,tbody,td{display:block;width:100%}
thead{display:none}
tbody tr{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:14px;padding:13px 15px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
tbody tr:hover{background:var(--card)}
tbody td{border:0;padding:0;white-space:normal}
td.tgl{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);padding-top:10px;border-top:1px solid var(--line)}
td.tgl::before{content:"Tanggal"}
td.pw::before{content:"Pengawas"}
tbody td:nth-child(2){font-size:16px;font-weight:600;line-height:1.4;margin-bottom:10px}
td.no{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);margin-bottom:8px}
td.no::before{content:"No SPK"}
.chip{font-size:14px;font-weight:600;color:var(--text);background:var(--accent-soft);padding:5px 11px;border-radius:8px}
td.tgl::before,td.pw::before{min-width:72px;font-size:12px;font-weight:400;color:var(--muted)}
td.pw{display:flex;align-items:center;flex-wrap:wrap;gap:6px 8px;font-size:14px;font-weight:600;padding-top:8px}
td.pw .pb{font-size:14px;padding:3px 12px}
.pb+.pb{margin-left:0}
td.pw.na{display:none}
td.empty{display:block;text-align:center;padding:28px 8px}
.pager button{flex:1;padding:12px 14px;font-size:15px}
.pager .sub{flex:0 0 auto}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Daftar SPK</h1>
      <div class="sub">No SPK, jenis pekerjaan, tanggal, dan pengawas</div>
    </div>
    <button class="icon" id="theme" aria-label="Ganti tema">◐</button>
  </header>
  <div class="tabs" role="tablist">
    <button class="tab on" role="tab" data-t="manika">SPK Manika <span class="n"></span></button>
    <button class="tab" role="tab" data-t="bangunan">SPK Bangunan <span class="n"></span></button>
  </div>
  <div class="tools">
    <input id="q" type="search" placeholder="Cari jenis pekerjaan atau nomor SPK…" autocomplete="off">
    <select id="yr" aria-label="Filter tahun"></select>
    <select id="sd" aria-label="Urutan tanggal"><option value="-1">Tanggal: terbaru dulu</option><option value="1">Tanggal: terlama dulu</option></select>
    <select id="sb" aria-label="Urut berdasarkan"><option value="0">Urut: Tanggal</option><option value="3">Urut: Pengawas</option><option value="2">Urut: No SPK</option><option value="1">Urut: Pekerjaan</option></select>
    <select id="pp" aria-label="Baris per halaman">
      <option value="25">25 per halaman</option><option value="50">50 per halaman</option><option value="100">100 per halaman</option>
    </select>
  </div>
  <div class="count" id="count"></div>
  <div class="tablewrap">
    <table>
      <thead><tr>
        <th data-k="2">No SPK <span class="ar"></span></th>
        <th data-k="1">Jenis Pekerjaan <span class="ar"></span></th>
        <th data-k="0">Tanggal SPK <span class="ar"></span></th>
        <th data-k="3">Pengawas <span class="ar"></span></th>
      </tr></thead>
      <tbody id="body"></tbody>
    </table>
  </div>
  <div class="pager">
    <button id="prev">‹ Sebelumnya</button>
    <span class="sub" id="pg"></span>
    <button id="next">Berikutnya ›</button>
  </div>
</div>
